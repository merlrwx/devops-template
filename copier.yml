_min_copier_version: "9.0.0"
_subdirectory: template
_answers_file: .copier-answers.yml
_templates_suffix: .jinja
_exclude:
  - "{% if project_type == 'generic' %}src{% endif %}"
  - "{% if project_type == 'generic' %}tests{% endif %}"
  - "{% if project_type == 'generic' %}pyproject.toml{% endif %}"
  - "{% if project_type == 'generic' %}mise.lock{% endif %}"
  - "{% if project_type != 'python-api-with-ui' %}src/{{ project_name | replace('-', '_') }}/ui.py{% endif %}"
  - "{% if not include_containers %}Dockerfile.api{% endif %}"
  - "{% if project_type != 'python-api-with-ui' or not include_containers %}Dockerfile.ui{% endif %}"
  - "{% if not include_containers %}.dockerignore{% endif %}"
  - "{% if not include_compose %}compose.yaml{% endif %}"
  - "{% if not include_devcontainer %}.devcontainer{% endif %}"
  - "{% if not include_github_actions %}.github/workflows/ci.yml{% endif %}"
  - "{% if not include_kubernetes %}kubernetes/base{% endif %}"
  - "{% if not include_flux %}kubernetes/flux{% endif %}"
  - "{% if project_type != 'python-api-with-ui' %}kubernetes/base/ui.yaml{% endif %}"

project_name:
  type: str
  help: Project name (lowercase letters, numbers, and single hyphens)
  default: my-project
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$')) %}
    Use lowercase letters and numbers, starting with a letter; separate words with single hyphens.
    {% endif %}

project_type:
  type: str
  help: Initial project type
  choices:
    - python-api
    - python-api-with-ui
    - generic
  default: python-api

include_containers:
  type: bool
  help: Include container image definitions
  default: false
  validator: >-
    {% if include_containers and project_type == 'generic' %}
    Container packaging is supported only for Python project types.
    {% endif %}

include_devcontainer:
  type: bool
  help: Include a VS Code development container
  default: false
  validator: >-
    {% if include_devcontainer and project_type == 'generic' %}
    Dev Containers are supported only for Python project types.
    {% endif %}

include_github_actions:
  type: bool
  help: Include GitHub Actions CI
  default: false
  when: "{{ project_type != 'generic' }}"
  validator: >-
    {% if include_github_actions and project_type == 'generic' %}
    GitHub Actions CI is supported only for Python project types.
    {% endif %}

include_compose:
  type: bool
  help: Include a local Compose configuration
  default: false
  when: "{{ include_containers }}"
  validator: >-
    {% if include_compose and not include_containers %}
    Compose requires container packaging.
    {% endif %}

api_port:
  type: int
  help: API port
  default: 8000
  when: "{{ include_containers }}"

ui_port:
  type: int
  help: UI port
  default: 8501
  when: "{{ include_containers and project_type == 'python-api-with-ui' }}"

include_kubernetes:
  type: bool
  help: Include Kubernetes Kustomize manifests
  default: false
  when: "{{ project_type != 'generic' }}"
  validator: >-
    {% if include_kubernetes and project_type == 'generic' %}
    Kubernetes manifests are supported only for Python project types.
    {% elif include_kubernetes and not include_containers %}
    Kubernetes requires container packaging.
    {% endif %}

kubernetes_namespace:
  type: str
  help: Kubernetes namespace
  default: "{{ project_name }}"
  when: "{{ include_kubernetes }}"
  validator: >-
    {% if include_kubernetes and (not (kubernetes_namespace | regex_search('^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$')) or kubernetes_namespace | length > 63) %}
    Use a Kubernetes namespace name of at most 63 lowercase letters, numbers, or hyphens, starting and ending with a letter or number.
    {% endif %}

include_flux:
  type: bool
  help: Include an opt-in Flux reconciliation bundle
  default: false
  when: "{{ include_kubernetes }}"
  validator: >-
    {% if include_flux and not include_kubernetes %}
    Flux requires Kubernetes manifests.
    {% endif %}

git_repository_url:
  type: str
  help: Git repository URL for Flux
  default: ""
  when: "{{ include_flux }}"
  validator: >-
    {% if include_flux and not (git_repository_url | regex_search('^(https://[^/]+/.+|ssh://[^/]+/.+|git@[^:]+:.+)$')) %}
    Flux requires an explicitly provided HTTPS or SSH Git repository URL.
    {% endif %}
